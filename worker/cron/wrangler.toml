# Sorteos AR - disparador externo del scraper. El cron de GitHub Actions se atrasa o se saltea
# (08/09/2026: 14 horas sin correr). Este Worker corre cada 5 minutos en Cloudflare (puntual) y,
# si estamos dentro de una ventana de sorteo, dispara el workflow "scrape" por la API de GitHub.
# Secreto: GITHUB_TOKEN = token fine-grained del dueño, solo repo sorteos-ar, permiso Actions: write.
name = "sorteos-ar-cron"
main = "src/index.js"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

[vars]
REPO = "nfgalindez-aiko/sorteos-ar"
WORKFLOW = "scrape.yml"
